name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Build six Portable archives and SHA256SUMS
        shell: bash
        run: python scripts/package_release.py --version "$GITHUB_REF_NAME"
      - name: Publish to the actual repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags+=(--prerelease --latest=false)
          else
            release_flags+=(--latest)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes "${release_flags[@]}"
