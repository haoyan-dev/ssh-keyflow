# TEMPORARY (ticket 01 spike). Remove before merging this branch.
name: Spike OpenSSH signing

on:
  push:
    branches: ['test/openssh-signature-spike']

permissions:
  contents: read

jobs:
  spike:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Run spike
        shell: bash
        run: |
          python -I .scratch/fleet-sync/spike/openssh_sign_spike.py "$RUNNER_TEMP/spike" > "$RUNNER_TEMP/report.json"
          cat "$RUNNER_TEMP/report.json"
          python -I -c "import json,sys; sys.exit(0 if json.load(open(sys.argv[1]))['all_as_expected'] else 1)" "$RUNNER_TEMP/report.json"
